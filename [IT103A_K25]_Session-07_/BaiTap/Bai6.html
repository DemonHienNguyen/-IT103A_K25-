<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai6</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./Bai6.css">
</head>

<body>
    <section class="section--display">
        <div>
            <h2>Niềng răng chỉnh nha</h2>
        </div>
        <div class="banner">
            <p>ĐANG ĐIỀU TRỊ</p>
        </div>
        <div class="div--play">
            <span class="special">Bác sĩ <i class="fa-solid fa-user-doctor"></i>: </span><span class="nameDoctor">BS.
                Nguyễn Minh Tâm</span><br>
            <span class="special">Chi phí <i class="fa-solid fa-wallet"></i>: </span><span class="nameDoctor">25.000.000
                đ</span>
        </div>
        <div class="process">
            <div>
                <h3 class = "processTitle">Tiến trình điều trị</h3>
            </div>
            <div class="processBar">
                <div class="processTo100"></div>
            </div>
        </div>
        <div class="footer">
            <p>Bắt đầu: 10/03/2025</p>
            <p>Dự kiến hoàn thành: 10/03/2026</p>
        </div>
    </section>
</body>

</html>
