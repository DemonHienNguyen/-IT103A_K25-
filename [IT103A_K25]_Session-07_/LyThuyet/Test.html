<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .box{
            width: 100px;
            height: 100px;
            border: 1px  solid black;
            border-radius: 5px;
        }
        .box1{
            background-color: red;
        }
        .box2{
            position: relative;
            background-color: green;
        }
    </style>
</head>
<body>

    <div class="Box1 box">
        Box 1
    </div>
    <div class="Box2 box">
        Box2
    </div>
</body>

</html>
